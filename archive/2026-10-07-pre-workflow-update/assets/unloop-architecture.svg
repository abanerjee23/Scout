<text x="1164" y="1094" class="heading">Galileo</text>
<text x="1164" y="1128" class="body">Traces + quality evaluations</text>
<text x="1164" y="1160" class="small">Minimised runtime diagnostics</text>
<text x="1164" y="1189" class="small">Not the financial audit record</text>

