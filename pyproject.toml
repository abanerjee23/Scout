[project]
name = "unloop"
version = "0.1.0"
description = "Unloop expense preparation proof of concept"
requires-python = ">=3.12,<3.14"
dependencies = ["flask>=3.1,<4", "pydantic>=2.10,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pillow>=11,<13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/unloop"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
