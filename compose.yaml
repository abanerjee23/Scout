# Local PostgreSQL only. This is not Railway deployment configuration.
name: unloop-dev
services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-trixie@sha256:724a4041afdb1750446e3f6b5cfa8f3b0ac5a2cf538ddfa6bfee4f94c2fa85c6
    environment:
      POSTGRES_USER: unloop
      POSTGRES_PASSWORD: unloop_local_dev
      POSTGRES_DB: unloop
    ports:
      - '127.0.0.1:15432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U unloop -d unloop']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
