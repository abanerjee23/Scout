# Local PostgreSQL only. This is not Railway deployment configuration.
name: unloop-dev
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: unloop
      POSTGRES_PASSWORD: unloop_local_dev
      POSTGRES_DB: unloop
    ports:
      - '127.0.0.1:15432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U unloop -d unloop']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
